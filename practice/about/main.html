<title>Fast Food</title>

<body>
    <div class="container-fluid navigation pt-3">
        <div class="row">
            <div class="col-6 d-flex justify-content-start align-items-center">

                    <h4 class="d-inline pl-2 text-white">Fast Food</h4>
                </i>
            </div>
            <div class="col-6 pt-2">
                <div class="row text-center p-0 d-flex justify-content-end align-items-center">
                    <div class="col-3">
                        <a href="#about" class="text-white navigation-link">About</a>
                    </div>

                    <div class="col-3">
                        <a href="#menu" class="text-white navigation-link">Menu</a>
                    </div>

                    <div class="col-3">

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container pt-5">
        <div class="row">
            <div class="col-5" id="card">
                <h1 class="title">Pizza</h1>
                <p class="price">Large  - 1500rs</p>

            </div>

            <div class="col-5" id="card">

                <p class="price">Zinger  - 400rs</p>
                <p class="price">Chicken - 300rs</p>
                <p class="price">Beef    - 350rs</p>
                <img src="burger.jpg" alt="Burger" class="img-fluid"></img><br><br>
                <button class="btn btn-outline-warning">Order Now !!</button>
            </div>
        </div>
    </div>

        <div class="container text-muted text-center py-2 mt-5">
            <h5>
                Copyright &copy; 2026 |
                <a class="text-warning" href="#tos">All Rights Are Reserved By <span class="text-primary style">Fast Food Services</span></a>
