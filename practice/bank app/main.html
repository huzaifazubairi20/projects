<!DOCTYPE html>
<html>
<head>
  <title>Bank App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">

    <h1 id="app-title">Huzaifa's Bank</h1>

    <div id="balance-box">
      <p id="balance-label">Available Balance</p>
      <p id="balance"></p>
    </div>

    <div id="entry-box">
      <label id="amount-label" for="amount">Enter Amount</label>
      <input type="number" id="amount" placeholder="0">
    </div>

    <div id="button-box">
      <button class="action credit" id="credit-btn">Credit</button>
      <button class="action debit" id="debit-btn">Debit</button>
    </div>

    <p id="message"></p>
    <p id="note">Terms and Conditions Apply</p>

  </div>

</body>
</html>
